[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory_dss"
version = "0.1.0"
description = "Decision Support System (СППР) for Inventory Management, Demand Forecasting, Supplier Evaluation & Stock Optimization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Teamwork DSS Architecture", email = "dev@inventory-dss.local" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
inventory-dss = "inventory_dss.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_dss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
